name: Terraform Destroy

on:
  workflow_dispatch:

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: environments/dev-github

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Retrieve SSH public key from Secrets Manager
        run: |
          SSH_PUBLIC_KEY=$(aws secretsmanager get-secret-value \
            --secret-id ${{ vars.SSH_PUBLIC_KEY_SECRET || 'terraform/ssh-public-key' }} \
            --query SecretString --output text)
          echo "SSH_PUBLIC_KEY=$SSH_PUBLIC_KEY" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config=github.s3.tfbackend

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve \
            -var-file=terraform.tfvars \
            -var="ssh_public_key=$SSH_PUBLIC_KEY"

      - name: Confirm destruction
        run: echo "Successfully destroyed environment dev-github"
