name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'ansible/**'
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'ansible/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev-github

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Retrieve SSH keys from Secrets Manager
        run: |
          SSH_PUBLIC_KEY=$(aws secretsmanager get-secret-value \
            --secret-id ${{ vars.SSH_PUBLIC_KEY_SECRET || 'terraform/ssh-public-key' }} \
            --query SecretString --output text)
          echo "SSH_PUBLIC_KEY=$SSH_PUBLIC_KEY" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config=github.s3.tfbackend

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -out=plan.tfplan \
            -no-color | tee plan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-plan
          path: |
            environments/dev-github/plan.tfplan
            environments/dev-github/plan.txt
          retention-days: 7

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/dev-github/plan.txt', 'utf8');
            const truncated = plan.substring(0, 65000);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });
