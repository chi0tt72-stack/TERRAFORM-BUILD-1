name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'ansible/**'
      - '.github/workflows/**'

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: environments/dev-github

    outputs:
      plan-exit-code: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Retrieve SSH keys from Secrets Manager
        run: |
          SSH_PRIVATE_KEY=$(aws secretsmanager get-secret-value \
            --secret-id ${{ vars.SSH_PRIVATE_KEY_SECRET || 'terraform/ssh-private-key' }} \
            --query SecretString --output text)
          echo "$SSH_PRIVATE_KEY" > /tmp/ssh_key
          chmod 0600 /tmp/ssh_key

          SSH_PUBLIC_KEY=$(aws secretsmanager get-secret-value \
            --secret-id ${{ vars.SSH_PUBLIC_KEY_SECRET || 'terraform/ssh-public-key' }} \
            --query SecretString --output text)
          echo "SSH_PUBLIC_KEY=$SSH_PUBLIC_KEY" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config=github.s3.tfbackend

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -out=plan.tfplan \
            -no-color | tee plan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-plan
          path: |
            environments/dev-github/plan.tfplan
            environments/dev-github/plan.txt
          retention-days: 7

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/ssh_key

  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: environments/dev-github

    outputs:
      asg_name: ${{ steps.outputs.outputs.asg_name }}
      instance_ips: ${{ steps.outputs.outputs.instance_ips }}
      vpc_id: ${{ steps.outputs.outputs.vpc_id }}
      s3_bucket_name: ${{ steps.outputs.outputs.s3_bucket_name }}
      awx_private_ip: ${{ steps.outputs.outputs.awx_private_ip }}
      awx_public_ip: ${{ steps.outputs.outputs.awx_public_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Retrieve SSH public key from Secrets Manager
        run: |
          SSH_PUBLIC_KEY=$(aws secretsmanager get-secret-value \
            --secret-id ${{ vars.SSH_PUBLIC_KEY_SECRET || 'terraform/ssh-public-key' }} \
            --query SecretString --output text)
          echo "SSH_PUBLIC_KEY=$SSH_PUBLIC_KEY" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config=github.s3.tfbackend

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -out=plan.tfplan \
            -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve plan.tfplan

      - name: Export Terraform Outputs
        id: outputs
        run: |
          echo "asg_name=$(terraform output -raw asg_name)" >> $GITHUB_OUTPUT
          echo "instance_ips=$(terraform output -json instance_ips)" >> $GITHUB_OUTPUT
          echo "vpc_id=$(terraform output -raw vpc_id)" >> $GITHUB_OUTPUT
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          AWX_IP=$(terraform output -raw awx_private_ip 2>/dev/null || echo "")
          if [ -n "$AWX_IP" ]; then
            echo "awx_private_ip=$AWX_IP" >> $GITHUB_OUTPUT
          fi
          AWX_PUBLIC_IP=$(terraform output -raw awx_public_ip 2>/dev/null || echo "")
          if [ -n "$AWX_PUBLIC_IP" ]; then
            echo "awx_public_ip=$AWX_PUBLIC_IP" >> $GITHUB_OUTPUT
          fi
          AWX_SG_ID=$(terraform output -raw awx_security_group_id 2>/dev/null || echo "")
          if [ -n "$AWX_SG_ID" ]; then
            echo "awx_sg_id=$AWX_SG_ID" >> $GITHUB_OUTPUT
          fi

      - name: Upload Plan Artifact on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: terraform-plan-debug
          path: |
            environments/dev-github/plan.tfplan
          retention-days: 7

      - name: Wait for ASG instances to be ready
        run: |
          ASG_NAME=$(terraform output -raw asg_name)
          echo "Waiting for ASG instances to reach InService state..."
          for i in $(seq 1 30); do
            INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
              --output text)
            COUNT=$(echo "$INSTANCE_IDS" | wc -w | tr -d ' ')
            echo "Attempt $i: $COUNT instances InService"
            if [ "$COUNT" -ge 2 ]; then
              break
            fi
            sleep 10
          done

      - name: Retrieve AWX Admin Password
        if: steps.outputs.outputs.awx_public_ip != ''
        run: |
          set -euo pipefail
          SECRET_ID="${{ vars.AWX_ADMIN_PASSWORD_SECRET || 'awx/admin-password' }}"
          echo "Retrieving AWX admin password from Secrets Manager (secret: $SECRET_ID)..."
          AWX_ADMIN_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --query SecretString --output text 2>&1) || {
            echo "::error::Failed to retrieve AWX admin password from Secrets Manager (secret: $SECRET_ID)"
            exit 1
          }
          echo "::add-mask::$AWX_ADMIN_PASSWORD"
          echo "AWX_ADMIN_PASSWORD=$AWX_ADMIN_PASSWORD" >> $GITHUB_ENV
          echo "AWX admin password retrieved successfully."

      - name: Open AWX SG for GitHub runner
        if: steps.outputs.outputs.awx_public_ip != ''
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "GitHub runner public IP: ${RUNNER_IP}"
          echo "RUNNER_IP=${RUNNER_IP}" >> $GITHUB_ENV
          AWX_SG_ID="${{ steps.outputs.outputs.awx_sg_id }}"
          echo "Adding ingress rule to SG ${AWX_SG_ID} for ${RUNNER_IP}/32 on port 80..."
          aws ec2 authorize-security-group-ingress \
            --group-id "$AWX_SG_ID" \
            --protocol tcp \
            --port 80 \
            --cidr "${RUNNER_IP}/32" \
            --tag-specifications "ResourceType=security-group-rule,Tags=[{Key=Name,Value=github-runner-temp}]"
          echo "SG rule added."

      - name: Wait for AWX Health
        if: steps.outputs.outputs.awx_public_ip != ''
        run: |
          set -euo pipefail
          AWX_IP="${{ steps.outputs.outputs.awx_public_ip }}"
          TIMEOUT=300
          INTERVAL=10
          ELAPSED=0
          echo "Waiting for AWX server at http://${AWX_IP}/api/v2/ping/ to become healthy..."
          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${AWX_IP}/api/v2/ping/" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "AWX server is healthy (HTTP 200)."
              exit 0
            fi
            echo "Health check attempt (${ELAPSED}s/${TIMEOUT}s): HTTP $HTTP_CODE - retrying in ${INTERVAL}s..."
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "::error::AWX server did not become healthy within ${TIMEOUT} seconds"
          exit 1

      - name: Update AWX Inventory
        if: steps.outputs.outputs.awx_public_ip != ''
        run: |
          set -euo pipefail
          AWX_IP="${{ steps.outputs.outputs.awx_public_ip }}"
          AWX_URL="http://${AWX_IP}"
          INSTANCE_IPS='${{ steps.outputs.outputs.instance_ips }}'

          echo "Fetching inventory ID for 'dev-inventory'..."
          HTTP_CODE=$(curl -s -o /tmp/inv_response.json -w "%{http_code}" \
            -u "admin:${AWX_ADMIN_PASSWORD}" \
            "${AWX_URL}/api/v2/inventories/?name=dev-inventory")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Failed to fetch inventory (HTTP $HTTP_CODE)"
            cat /tmp/inv_response.json
            exit 1
          fi
          INVENTORY_ID=$(cat /tmp/inv_response.json | python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['id'])")
          echo "Inventory ID: $INVENTORY_ID"

          echo "Fetching host group ID for 'dev_instances'..."
          HTTP_CODE=$(curl -s -o /tmp/group_response.json -w "%{http_code}" \
            -u "admin:${AWX_ADMIN_PASSWORD}" \
            "${AWX_URL}/api/v2/inventories/${INVENTORY_ID}/groups/?name=dev_instances")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Failed to fetch host group (HTTP $HTTP_CODE)"
            cat /tmp/group_response.json
            exit 1
          fi
          GROUP_ID=$(cat /tmp/group_response.json | python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['id'])")
          echo "Group ID: $GROUP_ID"

          echo "Clearing existing hosts in group..."
          HTTP_CODE=$(curl -s -o /tmp/hosts_response.json -w "%{http_code}" \
            -u "admin:${AWX_ADMIN_PASSWORD}" \
            "${AWX_URL}/api/v2/groups/${GROUP_ID}/hosts/")
          if [ "$HTTP_CODE" -eq 200 ]; then
            EXISTING_IDS=$(cat /tmp/hosts_response.json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for h in data.get('results', []):
              print(h['id'])" 2>/dev/null || true)
            for HOST_ID in $EXISTING_IDS; do
              curl -s -u "admin:${AWX_ADMIN_PASSWORD}" \
                -X POST -H "Content-Type: application/json" \
                -d "{\"id\": $HOST_ID, \"disassociate\": true}" \
                "${AWX_URL}/api/v2/groups/${GROUP_ID}/hosts/" > /dev/null
            done
          fi

          echo "Adding current ASG instance IPs to inventory..."
          IP_LIST=$(echo "$INSTANCE_IPS" | python3 -c "import sys,json; [print(ip) for ip in json.load(sys.stdin)]")
          INDEX=0
          for IP in $IP_LIST; do
            INDEX=$((INDEX + 1))
            echo "Adding host instance_${INDEX} ($IP)..."
            VARS=$(python3 -c "import json; print(json.dumps({'ansible_host': '$IP', 'ansible_user': 'ec2-user'}))")
            HTTP_CODE=$(curl -s -o /tmp/add_host_response.json -w "%{http_code}" \
              -u "admin:${AWX_ADMIN_PASSWORD}" \
              -X POST -H "Content-Type: application/json" \
              -d "{\"name\": \"instance_${INDEX}\", \"variables\": $(echo "$VARS" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")}" \
              "${AWX_URL}/api/v2/inventories/${INVENTORY_ID}/hosts/")
            if [ "$HTTP_CODE" -ne 201 ] && [ "$HTTP_CODE" -ne 200 ]; then
              echo "::error::Failed to add host instance_${INDEX} (HTTP $HTTP_CODE)"
              cat /tmp/add_host_response.json
              exit 1
            fi
            HOST_ID=$(cat /tmp/add_host_response.json | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            curl -s -u "admin:${AWX_ADMIN_PASSWORD}" \
              -X POST -H "Content-Type: application/json" \
              -d "{\"id\": $HOST_ID}" \
              "${AWX_URL}/api/v2/groups/${GROUP_ID}/hosts/" > /dev/null
            echo "Host instance_${INDEX} ($IP) added to group."
          done
          echo "AWX inventory updated successfully."

      - name: Launch AWX Job
        id: awx_job
        if: steps.outputs.outputs.awx_public_ip != ''
        run: |
          set -euo pipefail
          AWX_IP="${{ steps.outputs.outputs.awx_public_ip }}"
          AWX_URL="http://${AWX_IP}"
          INSTANCE_IPS='${{ steps.outputs.outputs.instance_ips }}'

          EXTRA_VARS=$(python3 -c "
          import json, sys
          ips = json.loads('$INSTANCE_IPS')
          print(json.dumps({'target_hosts': ips}))
          ")

          echo "Launching AWX job template 'site-yml'..."
          HTTP_CODE=$(curl -s -o /tmp/launch_response.json -w "%{http_code}" \
            -u "admin:${AWX_ADMIN_PASSWORD}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"extra_vars\": $(echo "$EXTRA_VARS" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")}" \
            "${AWX_URL}/api/v2/job_templates/site-yml/launch/")
          if [ "$HTTP_CODE" -ne 201 ] && [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Failed to launch AWX job (HTTP $HTTP_CODE)"
            cat /tmp/launch_response.json
            exit 1
          fi
          JOB_ID=$(cat /tmp/launch_response.json | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "AWX job launched successfully (Job ID: $JOB_ID)"
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT

      - name: Poll AWX Job Status
        if: steps.outputs.outputs.awx_public_ip != ''
        run: |
          set -euo pipefail
          AWX_IP="${{ steps.outputs.outputs.awx_public_ip }}"
          AWX_URL="http://${AWX_IP}"
          JOB_ID="${{ steps.awx_job.outputs.job_id }}"
          TIMEOUT=600
          INTERVAL=15
          ELAPSED=0

          echo "Polling AWX job $JOB_ID status..."
          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            HTTP_CODE=$(curl -s -o /tmp/job_status.json -w "%{http_code}" \
              -u "admin:${AWX_ADMIN_PASSWORD}" \
              "${AWX_URL}/api/v2/jobs/${JOB_ID}/")
            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "::error::Failed to fetch job status (HTTP $HTTP_CODE)"
              cat /tmp/job_status.json
              exit 1
            fi
            STATUS=$(cat /tmp/job_status.json | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "Job $JOB_ID status: $STATUS (${ELAPSED}s/${TIMEOUT}s)"

            case "$STATUS" in
              successful)
                echo "AWX job $JOB_ID completed successfully."
                exit 0
                ;;
              failed|error)
                echo "::error::AWX job $JOB_ID finished with status: $STATUS"
                echo "Retrieving job output..."
                curl -s -u "admin:${AWX_ADMIN_PASSWORD}" \
                  "${AWX_URL}/api/v2/jobs/${JOB_ID}/stdout/?format=txt" 2>/dev/null || true
                exit 1
                ;;
              pending|running)
                ;;
              *)
                echo "::warning::Unexpected job status: $STATUS"
                ;;
            esac

            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "::error::AWX job $JOB_ID did not complete within ${TIMEOUT} seconds"
          exit 1

      - name: Close AWX SG for GitHub runner
        if: always() && steps.outputs.outputs.awx_public_ip != ''
        run: |
          AWX_SG_ID="${{ steps.outputs.outputs.awx_sg_id }}"
          if [ -n "$RUNNER_IP" ] && [ -n "$AWX_SG_ID" ]; then
            echo "Removing ingress rule from SG ${AWX_SG_ID} for ${RUNNER_IP}/32 on port 80..."
            aws ec2 revoke-security-group-ingress \
              --group-id "$AWX_SG_ID" \
              --protocol tcp \
              --port 80 \
              --cidr "${RUNNER_IP}/32" 2>/dev/null || echo "Rule already removed or not found."
            echo "SG rule removed."
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/ssh_key
